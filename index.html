<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain For Sale</title>
<meta name="description" content="This domain is available for acquisition. Enquire for pricing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1a1a18;
    --muted: #9a978f;
    --line: #e6e3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --fg: #ecebe6; --muted: #75736c; --line: #2a2926; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Geist", system-ui, sans-serif;
    font-weight: 300;
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
    animation: rise 1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: "Bodoni Moda", Georgia, serif;
    font-weight: 400;
    font-size: 36px;
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 18px 0 14px;
    word-break: break-word;
  }
  h1:empty { display: none; }
  h1 em { font-style: italic; font-weight: 400; color: var(--muted); }
  .rule {
    width: 28px; height: 1px;
    background: var(--line);
    margin: 22px auto;
    border: 0;
  }
  p { color: var(--muted); }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 26px;
    padding: 9px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .02em;
    transition: border-color .3s, background .3s;
  }
  .cta:hover { border-color: var(--fg); }
  .cta svg { width: 12px; height: 12px; transition: transform .3s; }
  .cta:hover svg { transform: translateX(2px); }
  .num {
    display: block;
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: .04em;
  }
  .num:hover { color: var(--fg); }
  footer {
    position: fixed;
    bottom: 22px; left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="label">For sale</div>
  <h1 id="domain"></h1>
  <p>This domain is for sale.<br>Enquire privately for pricing.</p>
  <hr class="rule">
  <a class="cta" id="wa" href="https://wa.me/971557568805" target="_blank" rel="noopener">
    Enquire on WhatsApp
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 6h8M7 3l3 3-3 3"/></svg>
  </a>
  <a class="num" href="https://wa.me/971557568805" target="_blank" rel="noopener">+971 55 756 8805</a>
</main>
<footer>&copy; <span id="yr"></span></footer>
<script>
  (function () {
    var host = (location.hostname || "").replace(/^www\./, "");
    if (host && host.indexOf(".") > -1) {
      var i = host.indexOf(".");
      var h1 = document.getElementById("domain");
      h1.textContent = host.slice(0, i);
      var em = document.createElement("em");
      em.textContent = host.slice(i);
      h1.appendChild(em);
      document.title = host + " is for sale";
      var msg = "Hi, I'm interested in acquiring " + host + ". Could you share the price?";
      var url = "https://wa.me/971557568805?text=" + encodeURIComponent(msg);
      document.getElementById("wa").href = url;
    }
    document.getElementById("yr").textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
